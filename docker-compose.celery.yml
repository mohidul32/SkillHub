version: '3.8'
services:
  redis:
    image: redis
    ports:
      - "6380:6379"
  web:
    build: .
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - redis
  celery:
    build: .
    command: celery -A skillhub worker --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - redis
  celery-beat:
    build: .
    command: celery -A skillhub beat --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - redis

<!DOCTYPE html>
<html>
<head>
    <title>SkillHub</title>
</head>
<body>
    <header>
        <h1>SkillHub</h1>
        <nav>
            <a href="{% url 'signup' %}">Signup</a> |
            <a href="{% url 'login' %}">Login</a> |
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>
    <hr>
    {% block content %}{% endblock %}
</body>
<footer>
  <div>
    Total Users: {{ site_stats.total_users }} |
    Courses: {{ site_stats.total_courses }} |
    Gigs: {{ site_stats.total_gigs }}
  </div>

  {% if user_short %}
    <div>Hello, {{ user_short.username }} ({{ user_short.role }})</div>
  {% else %}
    <div><a href="{% url 'login' %}">Login</a></div>
  {% endif %}
</footer>

</html>
